name: Build and verify CEleste Echo
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'makefile'
      - 'icon.png'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies and official CE toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libc6-i386
          python3 -m pip install Pillow
          curl --fail --location --retry 3 https://github.com/CE-Programming/toolchain/releases/download/v11.2/CEdev-Linux.tar.gz -o "$RUNNER_TEMP/cedev.tar.gz"
          tar -xzf "$RUNNER_TEMP/cedev.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/CEdev/bin" >> "$GITHUB_PATH"
      - name: Regenerate graphics with official converter
        run: |
          cedev-config --version
          make gfx
      - name: Run state and actual selector/records integration tests
        run: python3 tools/test.py
      - name: Render selector layout preview
        run: python3 tools/render_preview.py
      - name: Compile calculator program
        run: make
      - name: Verify binary and original physics
        run: python3 tools/verify.py
      - name: Package install files
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 https://github.com/CE-Programming/libraries/releases/download/v15.0/clibs.8xg -o dist/clibs.8xg
          python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: CEleste-Echo
          if-no-files-found: error
          path: |
            dist/
            docs/selector-preview.png
            docs/selector-preview@2x.png
            build/tests/results.json
            build/verification.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Echo-failure-diagnostics
          path: build/
